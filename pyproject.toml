[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polyocr-service"
version = "0.4.0"
description = "A bounded, authenticated OCR and translation API powered by PaddleOCR."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ocr", "paddleocr", "fastapi", "translation", "multilingual"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/linhongyu510/polyocr-service"
Repository = "https://github.com/linhongyu510/polyocr-service"
Issues = "https://github.com/linhongyu510/polyocr-service/issues"

[project.scripts]
polyocr-service = "polyocr.__main__:main"

[project.optional-dependencies]
ocr = [
  "paddleocr>=3.0,<4",
  "paddlepaddle>=3.0,<4",
]
dev = [
  "build>=1.2,<2",
  "matplotlib>=3.7,<4",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polyocr = ["web/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: downloads OCR model assets and runs real inference",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "accuracy_test",
  "api_test",
  "benchmarks",
  "docs",
  "frontend_server.py",
  "paddleocr_vl_deployment",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

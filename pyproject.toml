[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyocr-service"
version = "0.1.0"
description = "A secure, testable OCR service powered by PaddleOCR"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.9,<1",
    "Pillow>=10,<12",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
ocr = [
    "paddlepaddle>=3.0,<4",
    "paddleocr>=3.0,<4",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

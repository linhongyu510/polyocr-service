<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>翻译 · PolyOCR Service</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;color:#172033}
    form{display:grid;gap:1rem}label{display:grid;gap:.4rem}input,textarea,button{padding:.7rem}
    textarea{min-height:10rem}button{background:#3157d5;color:white;border:0;border-radius:.4rem}
    pre{white-space:pre-wrap;background:#f4f6fa;padding:1rem}
  </style>
</head>
<body>
  <h1>PolyOCR Service 文本翻译</h1>
  <p><a href="/">返回 OCR</a></p>
  <form id="translation-form">
    <label>API Key（仅用于本次请求）<input id="api-key" type="password" autocomplete="off"></label>
    <label>目标语言<input id="target-language" value="zh" required></label>
    <label>每行一段文本<textarea id="texts" required></textarea></label>
    <button type="submit">翻译</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script>
    document.querySelector("#translation-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const headers = {"Content-Type": "application/json"};
      const key = document.querySelector("#api-key").value;
      if (key) headers["X-API-Key"] = key;
      const texts = document.querySelector("#texts").value.split("\n").filter(Boolean);
      const target_language = document.querySelector("#target-language").value;
      const response = await fetch("/v2/translate", {
        method: "POST", headers, body: JSON.stringify({texts, target_language})
      });
      document.querySelector("#result").textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>

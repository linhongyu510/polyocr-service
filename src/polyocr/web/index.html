<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PolyOCR Service</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem;color:#172033}
    form{display:grid;gap:1rem}label{display:grid;gap:.4rem}input,select,button{padding:.7rem}
    button{background:#3157d5;color:white;border:0;border-radius:.4rem}pre{white-space:pre-wrap;background:#f4f6fa;padding:1rem}
  </style>
</head>
<body>
  <h1>PolyOCR Service</h1>
  <p>Powered by PaddleOCR · <a href="/static/translation.html">文本翻译</a></p>
  <form id="ocr-form">
    <label>API Key（仅用于本次请求）<input id="api-key" type="password" autocomplete="off"></label>
    <label>图片<input id="image" name="file" type="file" accept="image/*" required></label>
    <label>语言<input name="language" value="zh"></label>
    <button type="submit">识别</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script>
    document.querySelector("#ocr-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const headers = {};
      const key = document.querySelector("#api-key").value;
      if (key) headers["X-API-Key"] = key;
      const response = await fetch("/v1/ocr", {method: "POST", headers, body: new FormData(form)});
      document.querySelector("#result").textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
